name: Build Godot releases

on:
  push:
    branches: [main, ettoremari-patch-1, feat/godot-scroll-desktop]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Download Godot and export templates
        run: |
          curl -L --fail --silent --show-error \
            'https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip' \
            -o godot.zip
          unzip -q godot.zip
          curl -L --fail --silent --show-error \
            'https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz' \
            -o templates.tpz
          mkdir -p templates "$HOME/.local/share/godot/export_templates/4.7.2.stable"
          unzip -q templates.tpz -d templates
          cp -a templates/templates/. "$HOME/.local/share/godot/export_templates/4.7.2.stable/"
          chmod +x Godot_v4.7.2-stable_linux.x86_64

      - name: Import project
        run: ./Godot_v4.7.2-stable_linux.x86_64 --headless --editor --quit --path .

      - name: Export Windows executable
        run: |
          mkdir -p build
          ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . --export-release "Windows Desktop" build/ProtocoloDeFuga.exe

      - name: Export Android APK
        run: |
          mkdir -p build
          ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . --export-debug "Android" build/ProtocoloDeFuga.apk

      - name: Sign Android APK
        run: |
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/android-debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          "$BUILD_TOOLS/zipalign" -p -f 4 build/ProtocoloDeFuga.apk build/ProtocoloDeFuga-aligned.apk
          mv build/ProtocoloDeFuga-aligned.apk build/ProtocoloDeFuga.apk
          "$BUILD_TOOLS/apksigner" sign \
            --ks "$RUNNER_TEMP/android-debug.keystore" \
            --ks-key-alias androiddebugkey \
            --ks-pass pass:android \
            --key-pass pass:android \
            build/ProtocoloDeFuga.apk
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs build/ProtocoloDeFuga.apk

      - name: Upload builds
        uses: actions/upload-artifact@v4
        with:
          name: ProtocoloDeFuga-Godot
          path: build/*
          if-no-files-found: error
