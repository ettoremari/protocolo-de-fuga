name: Build Android APK

on:
  push:
    branches: [feat/pygame-animations]
    paths:
      - "main.py"
      - "data/**"
      - "assets/**"
      - "buildozer.spec"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Android build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git zip unzip autoconf automake libtool pkg-config zlib1g-dev libncurses-dev cmake libffi-dev libssl-dev libltdl-dev

      - name: Install Buildozer
        run: python -m pip install buildozer==1.5.0 cython==0.29.36

      - name: Build debug APK
        run: |
          set +o pipefail
          yes | buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ProtocoloDeFuga-android-apk
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 14

  build-exe:
    runs-on: windows-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install game and packaging dependencies
        run: python -m pip install -r requirements.txt pyinstaller==6.22.3

      - name: Build Windows executable
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name ProtocoloDeFuga --add-data "data:data" --add-data "assets:assets" main.py

      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: ProtocoloDeFuga-windows-exe
          path: dist/ProtocoloDeFuga.exe
          if-no-files-found: error
          retention-days: 14

  publish-release:
    needs: [build-apk, build-exe]
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows and Android builds
        uses: actions/download-artifact@v4
        with:
          pattern: ProtocoloDeFuga-*
          path: release-assets
          merge-multiple: true

      - name: Give APK a stable download name
        run: |
          apk_file="$(find release-assets -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$apk_file"
          mv "$apk_file" release-assets/ProtocoloDeFuga.apk

      - name: Publish downloadable release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: Protocolo de Fuga 1.0.0
          make_latest: true
          generate_release_notes: false
          overwrite_files: true
          files: release-assets/*


